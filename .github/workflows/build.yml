name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:1.4.0
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        shell: bash
        run: |
          set +e
          yes | buildozer -v android debug > /tmp/build.log 2>&1
          EXITCODE=${PIPESTATUS[1]}
          echo "===== BUILD FINISHED (exit $EXITCODE) ====="
          tail -200 /tmp/build.log
          echo ""
          echo "===== ERRORS ONLY ====="
          grep -n -i -E "(error:|failed|cannot|no such|exception|fatal|Traceback)" /tmp/build.log | tail -60 || true
          if [ ! -f bin/*.apk ]; then
            echo "===== BUILD FAILED ====="
            exit 1
          fi
          echo "===== SUCCESS ====="
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqua-apk
          path: bin/*.apk
